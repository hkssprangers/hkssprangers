# Project-local rclone config, selected via RCLONE_CONFIG in mise.toml.
# No secrets here:
# - s3 uses the standard AWS credential chain (env vars, ~/.aws).
# - r2 reads RCLONE_CONFIG_R2_ACCESS_KEY_ID / RCLONE_CONFIG_R2_SECRET_ACCESS_KEY,
#   set in the gitignored mise.local.toml (values from SSM r2-access-key-id / r2-secret-access-key).

# Buckets outside ap-southeast-1 need the region overridden, e.g.
#   rclone lsf "s3,region=ap-east-1:hkssprangers-dev-serverlessdeploymentbucket-1b59sebawphb5"
[s3]
type = s3
provider = AWS
env_auth = true
region = ap-southeast-1

[r2]
type = s3
provider = Cloudflare
# SSP Rangers account
endpoint = https://5866a1959e70399a4020fd5a7657e1ca.r2.cloudflarestorage.com
region = auto
no_check_bucket = true
